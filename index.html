<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=1080, height=1080, initial-scale=1.0"
  >

  <title>東京WBGTサイネージ</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }

    html,
    body {
      width: 1080px;
      height: 1080px;
      background: #eef2f6;
      overflow: hidden;
    }

    body {
      padding: 20px;
    }

    .header {
      width: 1040px;
      height: 110px;
      padding: 0 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1565c0;
      color: #ffffff;
      border-radius: 20px;
      font-size: 46px;
      font-weight: bold;
    }

    #clock {
      font-size: 42px;
    }

.current {
  width: 1040px;
  height: 350px;
  margin-top: 20px;
  padding: 22px 30px;

  background: white;
  border: 5px solid #ff8c00;
  border-radius: 20px;

  display: grid;
  grid-template-rows: 70px 1fr 75px;
  align-items: center;
  justify-items: center;
}

.current-title {
  margin: 0;
  font-size: 42px;
  font-weight: bold;
  line-height: 1.2;
  text-align: center;
  align-self: center;
}

.current-value {
  margin: 0;
  font-size: 150px;
  font-weight: bold;
  line-height: 1;
  text-align: center;
  align-self: center;
}

.current-level {
  margin: 0;
  font-size: 56px;
  font-weight: bold;
  line-height: 1.2;
  text-align: center;
  align-self: center;
}

.forecast {
  width: 1040px;
  height: 470px;
  margin-top: 20px;

  background: white;
  border-radius: 20px;
  overflow: hidden;
}

table {
  width: 100%;
  height: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  background: white;
}

thead {
  height: 70px;
}

thead tr {
  height: 70px;
}

th {
  height: 70px;
  padding: 12px 20px;

  background: #0d47a1;
  color: white;

  font-size: 30px;
  line-height: 1.2;
  text-align: center;
  vertical-align: middle;
}

tbody {
  height: 400px;
}

tbody tr {
  height: 66px;
}

td {
  height: 66px;
  padding: 12px 20px;

  border-bottom: 1px solid #dddddd;

  font-size: 28px;
  line-height: 1.25;
  text-align: center;
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: none;
}

.footer {
  width: 1040px;
  height: 70px;
  margin-top: 20px;
  padding: 0 25px;

  background: white;
  border-radius: 20px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 24px;
  line-height: 1.3;
  color: #666666;
  text-align: center;
}

    .error {
      color: #d00000;
      font-weight: bold;
    }

/* ===== サイネージ表示サイズ調整 ===== */
html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #ffffff;
}

body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  /* ページ全体を90％に縮小 */
  transform: scale(0.80);
  transform-origin: top left;
}
  </style>
</head>

<body>
  <div class="header">
    <div>東京（44132）WBGT</div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="current" id="currentPanel">
    <div class="current-title">
      現在の暑さ指数（WBGT）
    </div>

    <div id="wbgtNow" class="current-value">
      --
    </div>

    <div id="wbgtLevel" class="current-level">
      取得中...
    </div>
  </div>

  <div class="forecast">
    <table>
      <thead>
        <tr>
          <th style="width: 33%;">時刻</th>
          <th style="width: 34%;">WBGT</th>
          <th style="width: 33%;">警戒レベル</th>
        </tr>
      </thead>

      <tbody id="forecastBody">
        <tr>
          <td colspan="3">
            WBGTデータ取得中...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer" id="footer">
    環境省WBGT予測値 東京44132
  </div>

  <script>
    "use strict";

    const WBGT_LOCAL_URL = "./wbgt.csv";

    function updateClock() {
      const now = new Date();

      const timeText = now.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      document.getElementById("clock").textContent = timeText;
    }

    function getLevel(value) {
      if (value >= 31) {
        return {
          text: "危険",
          color: "#d50000",
          borderColor: "#d50000",
          backgroundColor: "#fff1f1"
        };
      }

      if (value >= 28) {
        return {
          text: "厳重警戒",
          color: "#ef6c00",
          borderColor: "#ef6c00",
          backgroundColor: "#fff7ed"
        };
      }

      if (value >= 25) {
        return {
          text: "警戒",
          color: "#f9a825",
          borderColor: "#f9a825",
          backgroundColor: "#fffbea"
        };
      }

      if (value >= 21) {
        return {
          text: "注意",
          color: "#2e7d32",
          borderColor: "#2e7d32",
          backgroundColor: "#f1fff3"
        };
      }

      return {
        text: "ほぼ安全",
        color: "#1565c0",
        borderColor: "#1565c0",
        backgroundColor: "#f2f7ff"
      };
    }

    function normalizeText(text) {
      return text
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");
    }

    function parseCsvLine(line) {
      const values = [];
      let value = "";
      let insideQuote = false;

      for (let i = 0; i < line.length; i++) {
        const character = line[i];

        if (character === '"') {
          if (insideQuote && line[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            insideQuote = !insideQuote;
          }
        } else if (character === "," && !insideQuote) {
          values.push(value.trim());
          value = "";
        } else {
          value += character;
        }
      }

      values.push(value.trim());
      return values;
    }

    function findColumnIndex(headers, candidates) {
      const normalizedHeaders = headers.map(function(header) {
        return header
          .replace(/\s/g, "")
          .replace(/["']/g, "")
          .toLowerCase();
      });

      for (const candidate of candidates) {
        const normalizedCandidate = candidate
          .replace(/\s/g, "")
          .toLowerCase();

        const exactIndex =
          normalizedHeaders.indexOf(normalizedCandidate);

        if (exactIndex !== -1) {
          return exactIndex;
        }
      }

      for (let i = 0; i < normalizedHeaders.length; i++) {
        for (const candidate of candidates) {
          const normalizedCandidate = candidate
            .replace(/\s/g, "")
            .toLowerCase();

          if (
            normalizedHeaders[i].includes(normalizedCandidate)
          ) {
            return i;
          }
        }
      }

      return -1;
    }

    function parseDateTime(dateText, timeText) {
      const dateValue = String(dateText || "").trim();
      let timeValue = String(timeText || "").trim();

      if (!dateValue) {
        return null;
      }

      if (/^\d{1,2}$/.test(timeValue)) {
        timeValue = timeValue.padStart(2, "0") + ":00";
      }

      if (/^\d{3,4}$/.test(timeValue)) {
        timeValue =
          timeValue.padStart(4, "0").slice(0, 2) +
          ":" +
          timeValue.padStart(4, "0").slice(2, 4);
      }

      const normalizedDate = dateValue
        .replace(/年/g, "/")
        .replace(/月/g, "/")
        .replace(/日/g, "")
        .replace(/-/g, "/");

      const match = normalizedDate.match(
        /(\d{4})\/(\d{1,2})\/(\d{1,2})/
      );

      if (!match) {
        return null;
      }

      const year = Number(match[1]);
      const month = Number(match[2]) - 1;
      const day = Number(match[3]);

      const timeMatch = timeValue.match(
        /(\d{1,2}):?(\d{2})?/
      );

      const hour = timeMatch ? Number(timeMatch[1]) : 0;
      const minute =
        timeMatch && timeMatch[2]
          ? Number(timeMatch[2])
          : 0;

      const result = new Date(
        year,
        month,
        day,
        hour,
        minute,
        0
      );

      if (Number.isNaN(result.getTime())) {
        return null;
      }

      return result;
    }

    function parseWbgtCsv(csvText) {
      const lines = normalizeText(csvText)
        .split("\n")
        .map(function(line) {
          return line.trim();
        })
        .filter(function(line) {
          return line.length > 0;
        });

      if (lines.length < 2) {
        throw new Error(
          "CSVに表示可能なデータがありません"
        );
      }

      let headerRowIndex = -1;
      let headers = [];

      for (
        let rowIndex = 0;
        rowIndex < Math.min(lines.length, 20);
        rowIndex++
      ) {
        const possibleHeaders =
          parseCsvLine(lines[rowIndex]);

        const hasWbgt = possibleHeaders.some(function(value) {
          return /wbgt|暑さ指数/i.test(value);
        });

        if (hasWbgt) {
          headerRowIndex = rowIndex;
          headers = possibleHeaders;
          break;
        }
      }

      if (headerRowIndex === -1) {
        throw new Error(
          "CSVの見出し行を判定できません"
        );
      }

      const dateIndex = findColumnIndex(headers, [
        "年月日",
        "日付",
        "date"
      ]);

      const timeIndex = findColumnIndex(headers, [
        "時刻",
        "時間",
        "time",
        "hour"
      ]);

      const wbgtIndex = findColumnIndex(headers, [
        "WBGT",
        "暑さ指数",
        "予測値"
      ]);

      if (wbgtIndex === -1) {
        throw new Error(
          "CSV内にWBGT列が見つかりません"
        );
      }

      const records = [];

      for (
        let rowIndex = headerRowIndex + 1;
        rowIndex < lines.length;
        rowIndex++
      ) {
        const columns = parseCsvLine(lines[rowIndex]);

        const wbgtText = columns[wbgtIndex];

        if (wbgtText === undefined) {
          continue;
        }

        const wbgtValue = Number(
          String(wbgtText).replace(/[^\d.-]/g, "")
        );

        if (!Number.isFinite(wbgtValue)) {
          continue;
        }

        let dateTime = null;

        if (dateIndex !== -1) {
          dateTime = parseDateTime(
            columns[dateIndex],
            timeIndex !== -1
              ? columns[timeIndex]
              : ""
          );
        }

        if (
          !dateTime &&
          timeIndex !== -1 &&
          columns[timeIndex]
        ) {
          const today = new Date();

          const dateString =
            today.getFullYear() +
            "/" +
            String(today.getMonth() + 1).padStart(2, "0") +
            "/" +
            String(today.getDate()).padStart(2, "0");

          dateTime = parseDateTime(
            dateString,
            columns[timeIndex]
          );
        }

        if (!dateTime) {
          continue;
        }

        records.push({
          dateTime: dateTime,
          wbgt: wbgtValue
        });
      }

      records.sort(function(a, b) {
        return a.dateTime - b.dateTime;
      });

      if (records.length === 0) {
        throw new Error(
          "日時とWBGT値を読み取れませんでした"
        );
      }

      return records;
    }

    function selectCurrentRecord(records) {
      const now = new Date();

      let pastRecords = records.filter(function(record) {
        return record.dateTime <= now;
      });

      if (pastRecords.length > 0) {
        return pastRecords[pastRecords.length - 1];
      }

      return records[0];
    }

    function selectForecastRecords(records, currentRecord) {
      const futureRecords = records.filter(function(record) {
        return record.dateTime > currentRecord.dateTime;
      });

      return futureRecords.slice(0, 6);
    }

    function formatDateTime(dateTime) {
      return dateTime.toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function displayCurrent(record) {
      const level = getLevel(record.wbgt);
      const currentPanel =
        document.getElementById("currentPanel");

      document.getElementById("wbgtNow").textContent =
        record.wbgt.toFixed(1);

      document.getElementById("wbgtLevel").textContent =
        level.text;

      document.getElementById("wbgtNow").style.color =
        level.color;

      document.getElementById("wbgtLevel").style.color =
        level.color;

      currentPanel.style.borderColor =
        level.borderColor;

      currentPanel.style.backgroundColor =
        level.backgroundColor;
    }

    function displayForecast(records) {
      const forecastBody =
        document.getElementById("forecastBody");

      forecastBody.innerHTML = "";

      if (records.length === 0) {
        forecastBody.innerHTML =
          '<tr><td colspan="3">' +
          "これより先の予測値がありません" +
          "</td></tr>";

        return;
      }

      records.forEach(function(record) {
        const level = getLevel(record.wbgt);
        const row = document.createElement("tr");

        const timeCell = document.createElement("td");
        const wbgtCell = document.createElement("td");
        const levelCell = document.createElement("td");

        timeCell.textContent =
          formatDateTime(record.dateTime);

        wbgtCell.textContent =
          record.wbgt.toFixed(1);

        levelCell.textContent =
          level.text;

        wbgtCell.style.color = level.color;
        wbgtCell.style.fontWeight = "bold";

        levelCell.style.color = level.color;
        levelCell.style.fontWeight = "bold";

        row.appendChild(timeCell);
        row.appendChild(wbgtCell);
        row.appendChild(levelCell);

        forecastBody.appendChild(row);
      });
    }

    function showError(message) {
      document.getElementById("wbgtNow").textContent =
        "--";

      const levelElement =
        document.getElementById("wbgtLevel");

      levelElement.textContent = "取得失敗";
      levelElement.className = "current-level error";

      document.getElementById("forecastBody").innerHTML =
        '<tr><td colspan="3" class="error">' +
        message +
        "</td></tr>";

      document.getElementById("footer").textContent =
        "wbgt.csvの配置とGitHub Actionsを確認してください";
    }

    async function loadWbgtData() {
      try {
        const requestUrl =
          WBGT_LOCAL_URL + "?t=" + Date.now();

        const response = await fetch(requestUrl, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "wbgt.csvを取得できません HTTP " +
            response.status
          );
        }

        const csvText = await response.text();
        const records = parseWbgtCsv(csvText);
        const currentRecord =
          selectCurrentRecord(records);

        displayCurrent(currentRecord);

        displayForecast(
          selectForecastRecords(
            records,
            currentRecord
          )
        );

        document.getElementById("footer").textContent =
          "環境省WBGT予測値 東京44132　更新：" +
          new Date().toLocaleTimeString("ja-JP", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });
      } catch (error) {
        console.error(error);
        showError(error.message);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    loadWbgtData();
    setInterval(loadWbgtData, 10 * 60 * 1000);
  </script>
</body>
</html>
