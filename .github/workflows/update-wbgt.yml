name: Update WBGT Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create WBGT JSON
        run: |
          mkdir -p data

          cat > data/wbgt.json << EOF
          {
            "updated":"$(date)",
            "wbgt":30,
            "level":"厳重警戒"
          }
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/wbgt.json

          git diff --cached --quiet || git commit -m "Update WBGT"

          git push
