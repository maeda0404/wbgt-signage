name: Update WBGT Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create WBGT JSON
        run: |
          mkdir -p data

          echo '{
            "updated":"test",
            "wbgt":30,
            "level":"厳重警戒"
          }' > data/wbgt.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/wbgt.json

          git diff --cached --quiet || git commit -m "Update WBGT"

          git push
